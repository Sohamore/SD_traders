<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | SD Traders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">⚡ SD TRADERS</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Products</a>
        <a href="gallery.html">Gallery</a>
        <a href="cart.html">Cart</a>
        <a href="reviews.html">Reviews</a>
        <a href="order.html">Order</a>
        <a href="feedback.html">Feedback</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="page-title">
    <h1>Place Your Order</h1>
</section>

<section class="form-container">

    <div id="successMsg" style="display:none;" class="success">
        <h2>✅ Order Received!</h2>
        <p id="successText"></p>
        <a href="cart.html" class="btn" style="margin-top:12px; display:inline-block;">View Cart</a>
    </div>

    <form id="orderForm" onsubmit="return submitOrder(event)">
        <label>Name</label>
        <input type="text" name="name" id="name" required>

        <label>Email</label>
        <input type="email" name="email" id="email" required>

        <label>Select Product</label>
        <select name="product" id="product" required>
            <option value="">-- Select Toy --</option>
            <option>Electric Racing Car</option>
            <option>Hover Ball</option>
            <option>RC Helicopter</option>
            <option>RC Drift Car</option>
            <option>Smart Robot</option>
            <option>Electric Bike</option>
        </select>

        <label>Quantity</label>
        <input type="number" name="quantity" id="quantity" min="1" max="10" required>

        <button type="submit" class="btn">Place Order</button>
    </form>

</section>

<footer>
    <p>© 2026 SD Traders | Electric Toys</p>
</footer>

<script src="js/script.js"></script>
<script>
    function submitOrder(e) {
        e.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let product = document.getElementById("product").value;
        let quantity = parseInt(document.getElementById("quantity").value) || 1;

        if (!name) { alert("Please enter your name."); return false; }
        if (!email) { alert("Please enter your email."); return false; }
        if (!product) { alert("Please select a product."); return false; }
        if (quantity < 1) { alert("Quantity must be at least 1."); return false; }

        const prices = {
            "Electric Racing Car": 1499, "Hover Ball": 520,
            "RC Helicopter": 1799, "RC Drift Car": 1870,
            "Smart Robot": 999, "Electric Bike": 2499
        };
        let price = prices[product] || 1200;

        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let existing = cart.find(item => item.name.toLowerCase() === product.toLowerCase());
        if (existing) {
            existing.quantity += quantity;
            existing.customerName = name;
            existing.customerEmail = email;
        } else {
            cart.push({ customerName: name, customerEmail: email, name: product, price: price, quantity: quantity });
        }
        localStorage.setItem("cart", JSON.stringify(cart));

        document.getElementById("orderForm").style.display = "none";
        document.getElementById("successMsg").style.display = "block";
        document.getElementById("successText").innerHTML =
            `Thank you <b>${name}</b>! Your order for <b>${quantity}x ${product}</b> has been placed.<br>We will contact you at <b>${email}</b>.`;

        return false;
    }

    window.onload = function() { autoFillOrderForm(); };
</script>
</body>
</html>
